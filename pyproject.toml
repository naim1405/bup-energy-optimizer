[project]
name = "bup-energy-optimizer"
version = "0.1.0"
description = "FastAPI backend for the BUP energy optimizer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    # Optimization engine (app/engine): LP solved with scipy's HiGHS binding.
    "numpy>=1.26",
    "scipy>=1.11",
    # LLM layer (app/llm): operator-note interpretation.
    "langchain>=1.0",
    "langchain-openai>=1.0",
    # Reserved for the upcoming job queue — dependency only, no code yet.
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
